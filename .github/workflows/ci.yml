name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-not-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/agent-api/requirements.txt
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check app tests
      - name: Tests (domain, data quality, tools, validator, API, offline agent evals, Postgres parity)
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-secret@localhost:5432/postgres # gitleaks:allow
        run: python -m pytest -q
      - name: Offline eval report
        run: python -m app.evals

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
