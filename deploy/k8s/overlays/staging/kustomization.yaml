apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: testops-staging
resources:
  - ../../base
# CI bumps newTag to the pushed sha-<short> tag; ArgoCD syncs the change.
images:
  - name: ghcr.io/dangtrinh3006/testops-intelligence-agent/agent-api
    newTag: main
  - name: ghcr.io/dangtrinh3006/testops-intelligence-agent/web
    newTag: main
patches:
  - target: {kind: Namespace, name: testops}
    patch: |-
      - op: replace
        path: /metadata/name
        value: testops-staging
  - target: {kind: Ingress, name: testops}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: testops-staging.example.com
  - target: {kind: Deployment, name: web}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: HorizontalPodAutoscaler, name: agent-api}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
