[project]
name = "testops-agent-api"
version = "0.1.0"
description = "Evidence-first agent for CI failure triage, flaky-test analysis and release readiness (synthetic PoC)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "langgraph>=0.4",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
# MCP server (app/mcp_server.py); kept out of requirements.txt so the Vercel bundle is unchanged.
mcp = ["mcp>=2.3,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs a PostgreSQL database (TEST_DATABASE_URL)",
  "llm: calls a real model through the AI gateway (costs money)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
